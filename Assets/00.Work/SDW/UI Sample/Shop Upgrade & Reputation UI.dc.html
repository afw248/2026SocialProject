<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#FFF6E6;font-family:'Galmuri11',monospace;color:#3A2415;overflow:hidden;position:relative;">

  <div style="flex:none;height:72px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#FF6F61;border-bottom:4px solid #1a1a1a;">
    <div style="width:40px;height:40px;background:#fff;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <div style="width:10px;height:10px;border-left:3px solid #3A2415;border-bottom:3px solid #3A2415;transform:rotate(45deg);"></div>
    </div>
    <span style="font-size:20px;color:#fff;">상점 업그레이드 · 평판</span>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1a1a1a;padding:5px 12px;">
      <div style="width:26px;height:26px;background:#F2B705;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:11px;">W</div>
      <span style="font-size:15px;">1,267</span>
    </div>
  </div>

  <div style="flex:1;display:flex;gap:24px;padding:24px 32px;">

    <div style="width:400px;display:flex;flex-direction:column;gap:18px;">

      <div style="background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:20px;">
        <div style="font-size:14px;color:#8A6238;margin-bottom:10px;">매장 평판</div>
        <div style="height:26px;border:3px solid #1a1a1a;background:#F2E4C8;overflow:hidden;">
          <div style="width:64%;height:100%;background:#F2B705;"></div>
        </div>
        <div style="font-size:13px;color:#8A6238;margin-top:8px;">현재 등급: 단골 상점</div>
      </div>

      <div style="background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:20px;flex:1;display:flex;flex-direction:column;gap:12px;">
        <div style="font-size:14px;color:#8A6238;">문화권 이벤트</div>
        <sc-for list="{{ events }}" as="e" hint-placeholder-count="3">
          <div style="border:2px dashed #D9A97A;padding:12px;display:flex;flex-direction:column;gap:4px;">
            <span style="font-size:13px;">{{ e.title }}</span>
            <span style="font-size:11px;color:#B08055;">{{ e.desc }}</span>
          </div>
        </sc-for>
      </div>

      <div style="background:#F2E4C8;border:4px solid #1a1a1a;padding:16px;">
        <div style="font-size:13px;color:#8A6238;margin-bottom:8px;">급식 계약</div>
        <div style="height:44px;background:#fff;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:12px;color:#B08055;">EMPTY — 계약 상태 표시</span>
        </div>
      </div>

    </div>

    <div style="flex:1;display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:14px;color:#8A6238;">업그레이드 항목</div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:200px;gap:18px;">
        <sc-for list="{{ upgrades }}" as="u" hint-placeholder-count="6">
          <div style="background:#fff;border:3px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;padding:18px;display:flex;flex-direction:column;gap:10px;">
            <div style="width:56px;height:56px;background:{{ u.color }};border:2px solid #1a1a1a;"></div>
            <div style="font-size:14px;">{{ u.name }}</div>
            <div style="font-size:11px;color:#8A6238;">Lv.{{ u.level }} → Lv.{{ u.nextLevel }}</div>
            <div style="flex:1;"></div>
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:12px;color:#8A6238;">₩{{ u.cost }}</span>
              <div style="height:32px;padding:0 14px;background:#FF6F61;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(2px,2px);">
                <span style="font-size:12px;color:#fff;">강화</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  renderVals() {
    return {
      events: [
        { title: '문화 이벤트 A', desc: '특정 문화권 손님 방문 증가' },
        { title: '문화 이벤트 B', desc: '재료 수요 변화' },
        { title: '문화 이벤트 C', desc: '평판 보너스 기간' }
      ],
      upgrades: [
        { name: '조리대', level: 1, nextLevel: 2, cost: '350', color: '#FFD9A0' },
        { name: '진열대', level: 2, nextLevel: 3, cost: '520', color: '#F2B705' },
        { name: '간판', level: 1, nextLevel: 2, cost: '280', color: '#FF6F61' },
        { name: '좌석', level: 0, nextLevel: 1, cost: '150', color: '#D98CB0' },
        { name: '창고', level: 1, nextLevel: 2, cost: '410', color: '#6FC7D9' },
        { name: '포장대', level: 0, nextLevel: 1, cost: '200', color: '#B5723A' }
      ]
    };
  }
}
</script>
</body>
</html>
