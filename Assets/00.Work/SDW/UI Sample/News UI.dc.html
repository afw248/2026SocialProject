<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#FFF6E6;font-family:'Galmuri11',monospace;color:#3A2415;overflow:hidden;position:relative;">

  <div style="flex:none;height:72px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#FF6F61;border-bottom:4px solid #1a1a1a;">
    <span style="font-size:20px;color:#fff;">뉴스</span>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1a1a1a;padding:5px 12px;">
      <span style="font-size:13px;">2일차 18:45</span>
    </div>
  </div>

  <div style="flex:1;display:flex;gap:24px;padding:24px 32px;">

    <div style="width:480px;display:flex;flex-direction:column;gap:14px;overflow:hidden;">
      <div style="font-size:14px;color:#8A6238;">최근 소식</div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;overflow:hidden;">
        <sc-for list="{{ news }}" as="n" hint-placeholder-count="6">
          <div style="display:flex;gap:14px;background:#fff;border:3px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;padding:14px;cursor:pointer;">
            <div style="width:56px;height:56px;background:{{ n.color }};border:2px solid #1a1a1a;flex:none;"></div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              <span style="font-size:13px;">{{ n.title }}</span>
              <div style="display:flex;gap:6px;">
                <span style="font-size:10px;padding:2px 8px;background:{{ n.tagBg }};border:1px solid #1a1a1a;color:{{ n.tagColor }};">{{ n.tag }}</span>
                <span style="font-size:10px;color:#8A6238;">{{ n.day }}</span>
              </div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="flex:1;background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:28px;display:flex;flex-direction:column;gap:18px;">
      <div style="font-size:14px;color:#8A6238;">선택한 뉴스</div>
      <div style="width:100%;height:280px;border:2px dashed #D9A97A;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:13px;color:#B08055;">EMPTY — 픽셀 일러스트</span>
      </div>
      <div style="border:2px dashed #D9A97A;padding:14px;">
        <span style="font-size:13px;color:#B08055;">EMPTY — 헤드라인 · 본문 내용</span>
      </div>
      <div style="display:flex;gap:14px;">
        <div style="flex:1;border:2px dashed #D9A97A;padding:14px;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:11px;color:#8A6238;">경제 영향</span>
          <span style="font-size:12px;color:#B08055;">EMPTY</span>
        </div>
        <div style="flex:1;border:2px dashed #D9A97A;padding:14px;display:flex;flex-direction:column;gap:6px;">
          <span style="font-size:11px;color:#8A6238;">평판 영향</span>
          <span style="font-size:12px;color:#B08055;">EMPTY</span>
        </div>
      </div>
    </div>

  </div>

  <div style="position:absolute;bottom:32px;right:40px;width:200px;height:80px;background:#FF6F61;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">
    <span style="font-size:16px;color:#fff;">다음으로</span>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  renderVals() {
    return {
      news: [
        { title: '뉴스 헤드라인 01', color: '#FF6F61', tag: '경제', tagBg: '#FDE1D9', tagColor: '#D9432E', day: '2일차' },
        { title: '뉴스 헤드라인 02', color: '#F2B705', tag: '평판', tagBg: '#FBEBB8', tagColor: '#8A6238', day: '2일차' },
        { title: '뉴스 헤드라인 03', color: '#5FAE4E', tag: '문화 이벤트', tagBg: '#DDEFD9', tagColor: '#3E8A31', day: '1일차' },
        { title: '뉴스 헤드라인 04', color: '#6FC7D9', tag: '경제', tagBg: '#FDE1D9', tagColor: '#D9432E', day: '1일차' },
        { title: '뉴스 헤드라인 05', color: '#D98CB0', tag: '평판', tagBg: '#FBEBB8', tagColor: '#8A6238', day: '1일차' },
        { title: '뉴스 헤드라인 06', color: '#B5723A', tag: '문화 이벤트', tagBg: '#DDEFD9', tagColor: '#3E8A31', day: '1일차' }
      ]
    };
  }
}
</script>
</body>
</html>
