<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#FFF6E6;font-family:'Galmuri11',monospace;color:#3A2415;overflow:hidden;position:relative;">

  <div style="flex:none;height:72px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#FF6F61;border-bottom:4px solid #1a1a1a;">
    <div style="width:40px;height:40px;background:#fff;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <div style="width:10px;height:10px;border-left:3px solid #3A2415;border-bottom:3px solid #3A2415;transform:rotate(45deg);"></div>
    </div>
    <span style="font-size:20px;color:#fff;">레시피 도감</span>
    <div style="flex:1;"></div>
    <div style="display:flex;background:#fff;border:2px solid #1a1a1a;padding:4px;gap:4px;">
      <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="4">
        <div style="padding:8px 16px;cursor:pointer;font-size:13px;background:{{ t.bg }};color:{{ t.color }};">{{ t.label }}</div>
      </sc-for>
    </div>
  </div>

  <div style="flex:1;display:flex;gap:24px;padding:24px 32px;">

    <div style="flex:1;display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:14px;color:#8A6238;">전체 레시피 (12 / 28 해금)</div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:170px;gap:16px;">
        <sc-for list="{{ recipes }}" as="r" hint-placeholder-count="15">
          <div style="background:{{ r.cardBg }};border:3px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;">
            <div style="width:56px;height:56px;background:{{ r.color }};border:2px solid #1a1a1a;"></div>
            <span style="font-size:12px;color:{{ r.textColor }};">{{ r.name }}</span>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="width:420px;background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:24px;display:flex;flex-direction:column;gap:16px;">
      <div style="font-size:14px;color:#8A6238;">레시피 상세</div>
      <div style="width:100%;height:180px;border:2px dashed #D9A97A;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 완성 컵밥 아이콘</span>
      </div>
      <div style="border:2px dashed #D9A97A;padding:12px;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 레시피 이름 · 문화권 태그</span>
      </div>
      <div style="flex:1;border:2px dashed #D9A97A;padding:12px;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 필요 재료 목록</span>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  renderVals() {
    const colors = ['#FF6F61','#F2B705','#5FAE4E','#D98CB0','#6FC7D9','#B5723A','#E23B3B','#F2D24A'];
    const recipes = Array.from({ length: 15 }, (_, i) => {
      const locked = i % 4 === 3;
      return {
        name: locked ? '???' : `레시피 ${String(i + 1).padStart(2, '0')}`,
        color: locked ? '#D9CBB0' : colors[i % colors.length],
        cardBg: locked ? '#EDE3D0' : '#fff',
        textColor: locked ? '#B0A186' : '#3A2415'
      };
    });
    return {
      tabs: [
        { label: '전체', bg: '#FF6F61', color: '#fff' },
        { label: '한식', bg: 'transparent', color: '#3A2415' },
        { label: '아시안', bg: 'transparent', color: '#3A2415' },
        { label: '기타', bg: 'transparent', color: '#3A2415' }
      ],
      recipes
    };
  }
}
</script>
</body>
</html>
