<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#FFF6E6;font-family:'Galmuri11',monospace;color:#3A2415;overflow:hidden;position:relative;">

  <div style="flex:none;height:72px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#FF6F61;border-bottom:4px solid #1a1a1a;">
    <div style="width:40px;height:40px;background:#fff;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <div style="width:10px;height:10px;border-left:3px solid #3A2415;border-bottom:3px solid #3A2415;transform:rotate(45deg);"></div>
    </div>
    <span style="font-size:20px;color:#fff;">정보</span>
    <div style="flex:1;"></div>
    <div style="display:flex;background:#fff;border:2px solid #1a1a1a;padding:4px;gap:4px;">
      <div style="padding:8px 16px;cursor:pointer;font-size:13px;background:#FF6F61;color:#fff;">스킬트리</div>
      <div style="padding:8px 16px;cursor:pointer;font-size:13px;background:transparent;color:#3A2415;">보유 재고</div>
    </div>
  </div>

  <div style="flex:1;display:flex;gap:24px;padding:24px 32px;">

    <div style="flex:1;display:flex;flex-direction:column;gap:22px;overflow:hidden;">
      <div style="font-size:16px;color:#8A6238;">문화권 이해도 스킬트리</div>
      <sc-for list="{{ branches }}" as="b" hint-placeholder-count="4">
        <div style="display:flex;flex-direction:column;gap:16px;">
          <span style="font-size:16px;">{{ b.name }}</span>
          <div style="display:flex;align-items:center;gap:0;">
            <sc-for list="{{ b.nodes }}" as="node" hint-placeholder-count="5">
              <div style="display:flex;align-items:center;">
                <div style="width:88px;height:88px;border-radius:50%;background:{{ node.bg }};border:4px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">
                  <div style="width:32px;height:32px;background:{{ node.dot }};border:2px solid #1a1a1a;"></div>
                </div>
                <sc-if value="{{ node.hasLine }}" hint-placeholder-val="{{ true }}">
                  <div style="width:56px;height:6px;background:#1a1a1a;"></div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>

    <div style="width:420px;background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:24px;display:flex;flex-direction:column;gap:16px;">
      <div style="font-size:14px;color:#8A6238;">선택한 스킬</div>
      <div style="width:100%;height:120px;border:2px dashed #D9A97A;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 스킬 아이콘</span>
      </div>
      <div style="border:2px dashed #D9A97A;padding:14px;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 스킬 이름 · 설명</span>
      </div>
      <div style="border:2px dashed #D9A97A;padding:14px;flex:1;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 해금 조건 · 효과</span>
      </div>
      <div style="height:52px;background:#FF6F61;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(2px,2px);">
        <span style="font-size:14px;color:#fff;">해금하기</span>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  renderVals() {
    const mk = (unlocked, dot) => ({ bg: unlocked ? '#F2B705' : '#EDE3D0', dot, hasLine: true });
    return {
      branches: [
        { name: '한식', nodes: [mk(true,'#FF6F61'), mk(true,'#FF6F61'), mk(true,'#F2D24A'), mk(false,'#D9CBB0'), { ...mk(false,'#D9CBB0'), hasLine: false }] },
        { name: '일식', nodes: [mk(true,'#6FC7D9'), mk(false,'#D9CBB0'), mk(false,'#D9CBB0'), mk(false,'#D9CBB0'), { ...mk(false,'#D9CBB0'), hasLine: false }] },
        { name: '중식', nodes: [mk(true,'#D9432E'), mk(true,'#D9432E'), mk(false,'#D9CBB0'), mk(false,'#D9CBB0'), { ...mk(false,'#D9CBB0'), hasLine: false }] },
        { name: '양식', nodes: [mk(false,'#D9CBB0'), mk(false,'#D9CBB0'), mk(false,'#D9CBB0'), mk(false,'#D9CBB0'), { ...mk(false,'#D9CBB0'), hasLine: false }] }
      ]
    };
  }
}
</script>
</body>
</html>
