<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#FFF6E6;font-family:'Galmuri11',monospace;color:#3A2415;overflow:hidden;position:relative;">

  <div style="flex:none;height:72px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#FF6F61;border-bottom:4px solid #1a1a1a;">
    <div style="width:40px;height:40px;background:#fff;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">
      <div style="width:10px;height:10px;border-left:3px solid #3A2415;border-bottom:3px solid #3A2415;transform:rotate(45deg);"></div>
    </div>
    <span style="font-size:20px;color:#fff;">배송</span>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1a1a1a;padding:5px 12px;">
      <div style="width:26px;height:26px;background:#F2B705;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:11px;">W</div>
      <span style="font-size:15px;">1,267</span>
    </div>
  </div>

  <div style="flex:1;display:flex;gap:24px;padding:24px 32px;">

    <div style="flex:1;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:16px;">아침 정기 배송</span>
        <span style="font-size:11px;color:#8A6238;">매일 아침 자동 도착 · 무료</span>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;gap:12px;">
        <sc-for list="{{ morning }}" as="d" hint-placeholder-count="5">
          <div style="display:flex;align-items:center;gap:16px;background:#fff;border:3px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;padding:16px;">
            <div style="width:48px;height:48px;background:{{ d.color }};border:2px solid #1a1a1a;"></div>
            <div style="flex:1;">
              <div style="font-size:14px;">{{ d.name }}</div>
              <div style="font-size:11px;color:#8A6238;">수량 {{ d.qty }}개</div>
            </div>
            <div style="padding:6px 14px;background:{{ d.statusBg }};border:2px solid #1a1a1a;font-size:12px;color:{{ d.statusColor }};">{{ d.status }}</div>
          </div>
        </sc-for>
      </div>
      <div style="height:80px;border:2px dashed #D9A97A;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:12px;color:#B08055;">EMPTY — 다음 배송 예정 목록 편집</span>
      </div>
    </div>

    <div style="width:2px;background:#E9D8BC;"></div>

    <div style="width:520px;display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="font-size:16px;">익스프레스 배송</span>
        <span style="font-size:11px;color:#8A6238;">즉시 도착 · 유료</span>
      </div>

      <div style="background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:20px;display:flex;flex-direction:column;gap:14px;flex:1;">
        <div style="font-size:13px;color:#8A6238;">재료 선택</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
          <sc-for list="{{ expressItems }}" as="e" hint-placeholder-count="8">
            <div style="height:80px;background:#F2E4C8;border:2px solid #1a1a1a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;" style-hover="transform:translate(2px,2px);">
              <div style="width:32px;height:32px;background:{{ e.color }};border:2px solid #1a1a1a;"></div>
              <span style="font-size:10px;">{{ e.name }}</span>
            </div>
          </sc-for>
        </div>

        <div style="flex:1;border:2px dashed #D9A97A;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:12px;color:#B08055;">EMPTY — 선택한 재료 · 수량 담기</span>
        </div>

        <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:2px solid #1a1a1a;">
          <span style="font-size:13px;color:#8A6238;">배송 도착 시간</span>
          <span style="font-size:13px;">즉시</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span style="font-size:13px;color:#8A6238;">비용</span>
          <span style="font-size:16px;color:#D9432E;">₩ ---</span>
        </div>

        <div style="height:54px;background:#FF6F61;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(2px,2px);">
          <span style="font-size:15px;color:#fff;">즉시 배송 요청</span>
        </div>
      </div>
    </div>

  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  renderVals() {
    return {
      morning: [
        { name: '흰쌀밥', qty: 20, color: '#FFF3D6', status: '도착 완료', statusBg: '#DDEFD9', statusColor: '#5FAE4E' },
        { name: '제육', qty: 12, color: '#FF6F61', status: '도착 완료', statusBg: '#DDEFD9', statusColor: '#5FAE4E' },
        { name: '김치', qty: 15, color: '#E23B3B', status: '내일 도착', statusBg: '#F2E4C8', statusColor: '#8A6238' },
        { name: '계란', qty: 30, color: '#FFFDF6', status: '내일 도착', statusBg: '#F2E4C8', statusColor: '#8A6238' },
        { name: '고추장', qty: 8, color: '#C9451F', status: '재고 부족', statusBg: '#FBD9D4', statusColor: '#D9432E' }
      ],
      expressItems: [
        { name: '흰쌀밥', color: '#FFF3D6' }, { name: '제육', color: '#FF6F61' },
        { name: '불고기', color: '#B5723A' }, { name: '오징어', color: '#D98CB0' },
        { name: '김치', color: '#E23B3B' }, { name: '단무지', color: '#F2D24A' },
        { name: '고추장', color: '#C9451F' }, { name: '마요', color: '#FFF9EC' }
      ]
    };
  }
}
</script>
</body>
</html>
