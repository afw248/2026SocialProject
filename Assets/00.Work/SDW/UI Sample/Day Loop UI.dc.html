<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#3A2415;font-family:'Galmuri11',monospace;color:#fff;overflow:hidden;position:relative;align-items:center;justify-content:center;">

  <div style="position:absolute;top:40px;left:0;right:0;display:flex;justify-content:center;gap:0;">
    <sc-for list="{{ phases }}" as="p" hint-placeholder-count="3">
      <div style="display:flex;align-items:center;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;" onClick="{{ p.select }}">
          <div style="width:64px;height:64px;border-radius:50%;background:{{ p.bg }};border:4px solid #1a1a1a;box-shadow:4px 4px 0 #000;display:flex;align-items:center;justify-content:center;">
            <div style="width:24px;height:24px;background:{{ p.dot }};border:2px solid #1a1a1a;"></div>
          </div>
          <span style="font-size:13px;color:{{ p.textColor }};">{{ p.label }}</span>
        </div>
        <sc-if value="{{ p.hasLine }}" hint-placeholder-val="{{ true }}">
          <div style="width:100px;height:4px;background:#8A6238;margin-bottom:26px;"></div>
        </sc-if>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ isMorning }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:24px;">
      <div style="width:220px;height:220px;background:#FFD9A0;border:5px solid #1a1a1a;box-shadow:8px 8px 0 #000;border-radius:50%;"></div>
      <div style="font-size:40px;color:#fff;">아침 준비</div>
      <div style="font-size:15px;color:#F2E4C8;">2일차 · 오전 7:00</div>
      <div style="border:2px dashed #8A6238;padding:16px 24px;">
        <span style="font-size:13px;color:#D9C7A8;">EMPTY — 오늘의 재고 · 배송 체크 안내</span>
      </div>
    </div>
    <div style="position:absolute;bottom:56px;width:280px;height:76px;background:#F2B705;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #000;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(3px,3px);">
      <span style="font-size:18px;color:#3A2415;">준비 시작하기</span>
    </div>
  </sc-if>

  <sc-if value="{{ isBusiness }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:24px;">
      <div style="width:220px;height:220px;background:#F2B705;border:5px solid #1a1a1a;box-shadow:8px 8px 0 #000;clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);"></div>
      <div style="font-size:40px;color:#fff;">영업 시작</div>
      <div style="font-size:15px;color:#F2E4C8;">2일차 · 오전 9:00</div>
      <div style="border:2px dashed #8A6238;padding:16px 24px;">
        <span style="font-size:13px;color:#D9C7A8;">EMPTY — 오늘의 목표 · 이벤트 안내 문구</span>
      </div>
    </div>
    <div style="position:absolute;bottom:56px;width:280px;height:76px;background:#FF6F61;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #000;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(3px,3px);">
      <span style="font-size:18px;color:#fff;">영업 시작하기</span>
    </div>
  </sc-if>

  <sc-if value="{{ isClosing }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;flex-direction:column;align-items:center;gap:24px;">
      <div style="width:220px;height:220px;position:relative;">
        <div style="position:absolute;inset:0;background:#D9C7F2;border:5px solid #1a1a1a;box-shadow:8px 8px 0 #000;border-radius:50%;"></div>
        <div style="position:absolute;top:-14px;left:56px;width:220px;height:220px;background:#3A2415;border-radius:50%;"></div>
      </div>
      <div style="font-size:40px;color:#fff;">마감 정산</div>
      <div style="font-size:15px;color:#F2E4C8;">2일차 · 오후 10:00</div>
      <div style="border:2px dashed #8A6238;padding:16px 24px;">
        <span style="font-size:13px;color:#D9C7A8;">EMPTY — 오늘 매출 · 손님 로그 요약</span>
      </div>
    </div>
    <div style="position:absolute;bottom:56px;width:280px;height:76px;background:#D98CB0;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #000;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(3px,3px);">
      <span style="font-size:18px;color:#fff;">정산하러 가기</span>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  state = { phase: 'morning' };
  renderVals() {
    const cur = this.state.phase;
    const mk = (key, label) => ({
      label,
      bg: cur === key ? '#F2B705' : '#8A6238',
      dot: cur === key ? '#FF6F61' : '#F2E4C8',
      textColor: cur === key ? '#fff' : '#D9C7A8',
      hasLine: key !== 'closing',
      select: () => this.setState({ phase: key })
    });
    return {
      phases: [mk('morning', '아침 준비'), mk('business', '영업'), mk('closing', '마감')],
      isMorning: cur === 'morning',
      isBusiness: cur === 'business',
      isClosing: cur === 'closing'
    };
  }
}
</script>
</body>
</html>
