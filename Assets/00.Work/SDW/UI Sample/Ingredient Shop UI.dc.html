<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.13.17/dist/galmuri.css">
<style>body{margin:0;}</style>
</helmet>
<div style="width:1920px;height:1080px;display:flex;flex-direction:column;background:#FFF6E6;font-family:'Galmuri11',monospace;color:#3A2415;overflow:hidden;position:relative;">

  <div style="flex:none;height:72px;display:flex;align-items:center;gap:14px;padding:0 26px;background:#FF6F61;border-bottom:4px solid #1a1a1a;">
    <span style="font-size:20px;color:#fff;">재료 상점</span>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #1a1a1a;padding:5px 12px;">
      <div style="width:26px;height:26px;background:#F2B705;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:11px;">W</div>
      <span style="font-size:15px;">1,267</span>
    </div>
  </div>

  <div style="flex:1;display:flex;gap:24px;padding:24px 32px;">

    <div style="flex:1;display:flex;flex-direction:column;gap:14px;">
      <div style="font-size:14px;color:#8A6238;">재료 목록</div>
      <div style="flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:16px;overflow:hidden;">
        <sc-for list="{{ items }}" as="it" hint-placeholder-count="8">
          <div style="background:#fff;border:3px solid #1a1a1a;box-shadow:4px 4px 0 #1a1a1a;padding:16px;display:flex;flex-direction:column;gap:8px;">
            <div style="width:100%;height:60px;background:{{ it.color }};border:2px solid #1a1a1a;"></div>
            <div style="font-size:14px;">{{ it.name }}</div>
            <div style="font-size:11px;color:#8A6238;">₩{{ it.price }} / 개</div>
            <sc-if value="{{ it.hasBulk }}" hint-placeholder-val="{{ false }}">
              <div style="font-size:10px;color:#5FAE4E;">10개 이상 구매 시 -15%</div>
            </sc-if>
            <div style="flex:1;"></div>
            <div style="display:flex;align-items:center;gap:8px;">
              <div style="width:28px;height:28px;background:#F2E4C8;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">-</div>
              <div style="flex:1;height:28px;background:#F2E4C8;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:12px;">0</div>
              <div style="width:28px;height:28px;background:#F2E4C8;border:2px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;">+</div>
            </div>
          </div>
        </sc-for>
      </div>
    </div>

    <div style="width:380px;display:flex;flex-direction:column;gap:18px;">

      <div style="background:#fff;border:4px solid #1a1a1a;box-shadow:6px 6px 0 #1a1a1a;padding:20px;flex:1;display:flex;flex-direction:column;gap:12px;">
        <div style="font-size:14px;color:#8A6238;">장바구니</div>
        <sc-for list="{{ cart }}" as="c" hint-placeholder-count="3">
          <div style="display:flex;justify-content:space-between;border:2px dashed #D9A97A;padding:10px 12px;">
            <span style="font-size:13px;">{{ c.name }} x{{ c.qty }}</span>
            <span style="font-size:13px;color:#8A6238;">₩{{ c.subtotal }}</span>
          </div>
        </sc-for>
        <div style="flex:1;border:2px dashed #D9A97A;display:flex;align-items:center;justify-content:center;">
          <span style="font-size:12px;color:#B08055;">EMPTY SLOT</span>
        </div>
      </div>

      <div style="background:#F2E4C8;border:4px solid #1a1a1a;padding:18px;display:flex;flex-direction:column;gap:12px;">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:13px;color:#8A6238;">대량구매 할인</span>
          <span style="font-size:13px;color:#5FAE4E;">-₩0</span>
        </div>
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:15px;">총 결제금액</span>
          <span style="font-size:18px;">₩ 0</span>
        </div>
        <div style="height:54px;background:#FF6F61;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(2px,2px);">
          <span style="font-size:15px;color:#fff;">구매하기</span>
        </div>
        <div style="height:46px;background:#fff;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;cursor:pointer;" style-hover="transform:translate(2px,2px);">
          <span style="font-size:13px;color:#8A6238;">안 사고 넘어가기</span>
        </div>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1920, &quot;height&quot;: 1080}}">
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { name: '흰쌀밥', price: 40, color: '#FFF3D6', hasBulk: true },
        { name: '제육', price: 120, color: '#FF6F61', hasBulk: true },
        { name: '불고기', price: 130, color: '#B5723A', hasBulk: true },
        { name: '오징어', price: 140, color: '#D98CB0', hasBulk: false },
        { name: '김치', price: 60, color: '#E23B3B', hasBulk: true },
        { name: '단무지', price: 30, color: '#F2D24A', hasBulk: false },
        { name: '고추장', price: 90, color: '#C9451F', hasBulk: true },
        { name: '마요', price: 70, color: '#FFF9EC', hasBulk: false }
      ],
      cart: [
        { name: '흰쌀밥', qty: 10, subtotal: 340 },
        { name: '제육', qty: 5, subtotal: 600 }
      ]
    };
  }
}
</script>
</body>
</html>
